# ─────────────────────────────────────────────────────────────────────────────
# Flash — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# MEDIUM-13 FIX: Memory limits added to all services so a runaway process
# cannot OOM-kill the host machine.
#
# Start the full stack:
#   docker compose up -d --build
#
# First time setup:
#   1. cp backend/.env.example backend/.env
#   2. Fill in your values in backend/.env
#   3. cp .env.example .env
#   4. Fill in POSTGRES_PASSWORD / REDIS_PASSWORD in .env (Compose reads this
#      root .env automatically — it's a different file from backend/.env)
#   5. docker compose up -d --build
#   6. docker compose exec backend node src/db/migrate.js
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: flash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-flash_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flash_user} -d ${POSTGRES_DB:-flash_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flash_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m

  # ── Flash Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flash_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-flash_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flash_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
