name: Flash CI

on:
  push:
    branches: [main, production-hardening-final]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: flash_test
          POSTGRES_PASSWORD: flash_test
          POSTGRES_DB: flash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://flash_test:flash_test@localhost:5432/flash_test
      JWT_SECRET: ci_test_jwt_secret_not_real_do_not_use_in_prod
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      REDIS_URL: disabled
      PORT: 3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: node src/db/migrate.js

      - name: Run unit tests
        working-directory: backend
        run: npm test -- --testPathPattern=tests/unit --forceExit --coverage

      - name: Run integration tests
        working-directory: backend
        run: npm test -- --testPathPattern=tests/integration --forceExit
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  mobile-check:
    name: Mobile — Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check user app dependencies
        working-directory: flash-user-app
        run: |
          npm ci --ignore-scripts
          echo "User app dependencies OK"

      - name: Check driver app dependencies
        working-directory: flash-driver-app
        run: |
          npm ci --ignore-scripts
          echo "Driver app dependencies OK"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
